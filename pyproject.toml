[project]
name = "cfrating"
version = "0.1.0"
description = "Estimate Codeforces user skill and problem parameters from contest outcomes"
readme = "README.md"
authors = [
    { name = "Sebastian Mestre", email = "mestresebastianunr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
]

[project.scripts]
cfrating-gather = "cfrating.gather.cli:main"
cfrating-fit = "cfrating.fit.cli:main"
cfrating-plot = "cfrating.plot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
